<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Google Calendar, Istiqomah</title>
  <style>
    :root { color-scheme: light dark; --bg: #e8f1fc; --surface: #fff; --ink: #14163c; --muted: #555a85; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1030; --surface: #1a1d47; --ink: #f2f2ff; --muted: #b4b6dc; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--ink); font: 500 1.0625rem/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
    main { max-width: 26rem; padding: 1.5rem; border-radius: 1.5rem; background: var(--surface); }
    h1 { font: 800 1.75rem/1.15 ui-rounded, system-ui, sans-serif; margin: 0.25rem 0 0.5rem; }
    p { margin: 0; color: var(--muted); }
    .emoji { font-size: 3.25rem; line-height: 1; }
  </style>
</head>
<body>
  <main>
    <div class="emoji" id="emoji" aria-hidden="true"></div>
    <h1 id="judul"></h1>
    <p id="pesan"></p>
  </main>
  <script>
    var HASIL = {
      ok: ['🎉', 'Google Calendar tersambung', 'Tutup halaman ini dan balik ke aplikasi Istiqomah. Acaranya bakal muncul dalam beberapa detik.'],
      izin: ['🙏', 'Izinnya belum lengkap', 'Balik ke Istiqomah, ketuk Hubungkan lagi, dan centang semua izin yang diminta. Tanpa itu kalender tidak bisa tersambung.'],
      kedaluwarsa: ['⏱️', 'Tautannya sudah kedaluwarsa', 'Balik ke Istiqomah dan ketuk Hubungkan lagi. Tautan hanya berlaku 10 menit.'],
      gagal: ['😕', 'Sambungan gagal', 'Balik ke Istiqomah dan coba hubungkan lagi. Data kamu tidak berubah.']
    };
    var kode = new URLSearchParams(location.search).get('hasil');
    var isi = HASIL[kode] || HASIL.gagal;
    document.getElementById('emoji').textContent = isi[0];
    document.getElementById('judul').textContent = isi[1];
    document.getElementById('pesan').textContent = isi[2];
  </script>
</body>
</html>
